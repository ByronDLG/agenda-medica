<main class="flex min-h-screen items-center justify-center bg-stone-50 px-4 py-10 text-slate-900">
  <section class="w-full max-w-md rounded-2xl border border-stone-200 bg-white p-6 shadow-sm sm:p-9" aria-labelledby="login-title">
    <a class="flex items-center gap-3 text-slate-900 no-underline" href="/" aria-label="Agenda Médica, inicio">
      <span class="flex size-10 items-center justify-center rounded-xl bg-teal-800 text-white" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" class="size-6">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="text-sm font-bold tracking-tight">Agenda Médica</span>
    </a>

    <div class="mt-9">
      <p class="text-sm font-semibold text-teal-800">Acceso al consultorio</p>
      <h1 id="login-title" class="mt-2 text-2xl font-semibold tracking-tight">Inicia sesión</h1>
      <p class="mt-3 text-sm leading-6 text-slate-600">Usa la cuenta que creaste por invitación o mediante el aprovisionamiento inicial.</p>

      @if (errorMessage()) {
        <p class="mt-5 rounded-xl border border-rose-200 bg-rose-50 p-3 text-sm leading-5 text-rose-900" role="alert">{{ errorMessage() }}</p>
      }

      <form class="mt-6 space-y-5" (submit)="signIn($event)">
        <div>
          <label class="block text-sm font-medium text-slate-800" for="email">Correo</label>
          <input
            class="mt-2 min-h-11 w-full rounded-xl border border-stone-300 bg-white px-3 text-base text-slate-900 outline-none focus:border-teal-800 focus:ring-2 focus:ring-teal-800/20"
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            required
            maxlength="254"
            [value]="email"
            (input)="updateEmail($event)"
            [disabled]="state() !== 'ready'"
          >
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-800" for="password">Contraseña</label>
          <input
            class="mt-2 min-h-11 w-full rounded-xl border border-stone-300 bg-white px-3 text-base text-slate-900 outline-none focus:border-teal-800 focus:ring-2 focus:ring-teal-800/20"
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            minlength="12"
            maxlength="128"
            [value]="password"
            (input)="updatePassword($event)"
            [disabled]="state() !== 'ready'"
          >
        </div>

        <button
          class="min-h-11 w-full rounded-xl bg-teal-800 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-teal-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-800 disabled:cursor-wait disabled:opacity-60"
          type="submit"
          [disabled]="state() !== 'ready'"
        >
          @if (state() === 'loading') {
            Preparando…
          } @else if (state() === 'submitting') {
            Iniciando sesión…
          } @else {
            Iniciar sesión
          }
        </button>
      </form>

      <p class="mt-6 text-xs leading-5 text-slate-500">Si no tienes invitación, contacta al administrador del consultorio. No hay registro público.</p>
    </div>
  </section>
</main>
